name: Publish v0.8.0 test (one-shot)
on:
  push:
    branches: [release/v0.8.0-test.1]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test unit, race and static checks
        run: |
          go test ./...
          go test -race ./core
          go vet ./...
      - name: Build portable Windows x64 app
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-v0.8.0-test-Windows-x64.exe ./cmd/magicdesk
      - name: Create SHA-256 checksums
        run: sha256sum MagicPatchDesk-v0.8.0-test-Windows-x64.exe > SHA256SUMS.txt
      - name: Publish developer prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.8.0-test.1 MagicPatchDesk-v0.8.0-test-Windows-x64.exe SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.8.0 test 1 — Diagnostic reporting" \
            --notes-file docs/RELEASE_NOTES_v0.8.0-test.md \
            --prerelease
