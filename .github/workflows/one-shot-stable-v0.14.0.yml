name: One-shot stable Magic Patch Desk v0.14.0 release

on:
  push:
    branches:
      - release/v0.14.0-stable-polish
    paths:
      - .github/workflows/one-shot-stable-v0.14.0.yml

permissions:
  contents: write

concurrency:
  group: magicpatchdesk-stable-v0140-once
  cancel-in-progress: false

jobs:
  verify-build:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify update contract, fixtures and embedded icon
        run: |
          bash scripts/verify_release_contract.sh
          python3 scripts/test_patchhub_media_index.py
          grep -Fq 'const AppVersion = "v0.14.0"' core/update.go
          grep -Fq 'const UpdateProtocol = 1' core/update.go
          test -s cmd/magicdesk/patchhub_home_logo.png
          python3 scripts/build_windows_icon.py
      - name: Complete Go tests, race and vet
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./core
          go vet ./...
      - name: Build stable Win64 native GUI, verify PE and SHA256
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-H windowsgui -s -w" -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
          file MagicPatchDesk-Windows-x64.exe | grep 'PE32+'
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-stable-v0140-win64
          path: |
            MagicPatchDesk-Windows-x64.exe
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error

  windows-native-smoke:
    needs: verify-build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-stable-v0140-win64
          path: .
      - name: Native Windows GUI + embedded PNG + update health check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $pwd 'MagicPatchDesk-Windows-x64.exe'
          $env:MPD_UI_SMOKE_REPORT=Join-Path $env:RUNNER_TEMP 'mpd-stable-ui-smoke.txt'
          Remove-Item $env:MPD_UI_SMOKE_REPORT -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -ArgumentList '--mpd-ui-smoke-v1' -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Native Win32 UI smoke timed out'
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $env:MPD_UI_SMOKE_REPORT) {Get-Content $env:MPD_UI_SMOKE_REPORT}
            throw "Native Windows UI smoke exited $($p.ExitCode)"
          }
          Write-Host 'Native Win32 GUI and Patch Hub image: PASS'
          $p=Start-Process -FilePath $exe -ArgumentList '--mpd-healthcheck-v1' -PassThru -Wait
          if ($p.ExitCode -ne 0){throw "Updater protocol v1 healthcheck exited $($p.ExitCode)"}
          Write-Host 'Updater protocol v1: PASS'

  publish-stable:
    needs: windows-native-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-stable-v0140-win64
          path: .
      - name: Publish full stable release (not a prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          if gh release view v0.14.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Stable v0.14.0 already published; refusing to overwrite'
            exit 1
          fi
          gh release create v0.14.0 MagicPatchDesk-Windows-x64.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "Magic Patch Desk v0.14.0 — Stable" \
            --notes-file docs/RELEASE_NOTES_v0.14.0.md
