name: One-shot Magic Patch Desk test.13 split disc and Home

on:
  push:
    branches:
      - feature/cci-split-game-detection-home-20261122
    paths:
      - .github/workflows/release-test13-once.yml

permissions:
  contents: write

concurrency:
  group: magicpatchdesk-test13-once
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify permanent updater contract
        run: bash scripts/verify_release_contract.sh
      - name: Verify PatchHub media index fixture
        run: python3 scripts/test_patchhub_media_index.py
      - name: Embed native JMP Windows icon
        run: python3 scripts/build_windows_icon.py
      - name: Run all Go tests, including synthetic CCI and numbered ISO split sets
        run: go test -count=1 ./...
      - name: Go race detector
        run: go test -race -count=1 ./core
      - name: Go vet
        run: go vet ./...
      - name: Windows 10/11 x64 native GUI cross-build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Verify updater version Windows executable and checksums
        run: |
          grep -q 'const AppVersion = "v0.14.0-test.13"' core/update.go
          grep -q 'const UpdateProtocol = 1' core/update.go
          test -s MagicPatchDesk-Windows-x64.exe
          file MagicPatchDesk-Windows-x64.exe | grep -q PE32
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish preview only when all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.14.0-test.13 \
            MagicPatchDesk-Windows-x64.exe SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Magic Patch Desk v0.14.0 test 13 — Home and split-disc support" \
            --notes-file docs/RELEASE_NOTES_v0.14.0-test.13.md \
            --prerelease
