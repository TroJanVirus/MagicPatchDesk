name: One-shot PatchHub/JMP canonical title audit
on:
  push:
    branches:
      - tools/patchhub-jmp-title-audit-20261123
    paths:
      - .github/workflows/one-shot-title-audit.yml
permissions:
  contents: write
concurrency:
  group: one-shot-patchhub-title-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Obtain authoritative public JMP repository read-only
        run: |
          git clone --depth 1 https://github.com/JayYardley/Xbox-Magic-Patches-by-Jay.git /tmp/patchhub-jmps
          python3 -m py_compile scripts/patchhub_title_reconcile.py
      - name: Run real website/JMP title audit without editing patches
        run: |
          python3 scripts/patchhub_title_reconcile.py --patches-root /tmp/patchhub-jmps --output /tmp/title-audit
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('/tmp/title-audit')
          s=json.loads((p/'summary.json').read_text())
          print('ACTUAL TITLE AUDIT SUMMARY',s)
          rows=list(csv.DictReader((p/'title_audit.csv').open(encoding='utf-8-sig',newline='')))
          for status in ('safe','review','unmatched'):
              selected=[r for r in rows if r['status']==status]
              print('\n'+status.upper()+f' EXAMPLES ({len(selected)} total)')
              for r in selected[:24]:
                  print(f"{r['title_id']} | {r['old_title']} -> {r['canonical_title']} | {r['path']}")
          PY
      - name: Publish reviewable snapshots to ONLY this audit branch
        run: |
          mkdir -p docs/audits
          cp /tmp/title-audit/summary.json docs/audits/title-audit-summary.json
          cp /tmp/title-audit/title_audit.csv docs/audits/title-audit.csv
          cp /tmp/title-audit/manual_review.csv docs/audits/manual-review.csv
          cp /tmp/title-audit/canonical_titles.v1.json docs/audits/canonical-titles.v1.json
          cp /tmp/title-audit/proposed_title_changes.patch docs/audits/proposed-title-changes.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audits
          if ! git diff --cached --quiet; then
            git commit -m 'Publish review-only live PatchHub/JMP title audit snapshot'
            git push origin HEAD:refs/heads/tools/patchhub-jmp-title-audit-20261123
          fi
