name: Publish v0.13.0-test.2 after integrity QA (one-shot)
on:
  push:
    branches: [fix/v0.13.0-image-integrity]
    paths:
      - '.github/workflows/one-shot-integrity-audit.yml'
permissions:
  contents: read
concurrency:
  group: mpd-v0.13.0-test2-only
  cancel-in-progress: false
jobs:
  verify_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify permanent updater contract and intended release version
        run: |
          bash scripts/verify_release_contract.sh
          grep -q 'const AppVersion = "v0.13.0-test.2"' core/update.go
          test -f CREDITS.md
          test -f docs/RELEASE_NOTES_v0.13.0-test.2.md
      - name: Complete Go test suite (fresh cache)
        run: go test -count=1 ./...
      - name: Core race detector
        run: go test -race -count=1 ./core
      - name: Static analysis
        run: go vet ./...
      - name: Cross-compile Windows x64 desktop executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Create and verify update checksum manifest
        run: |
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c%s MagicPatchDesk-Windows-x64.exe)" -gt 1000000
      - uses: actions/upload-artifact@v4
        with:
          name: mpd-v013-test2-certified-candidate
          path: |
            MagicPatchDesk-Windows-x64.exe
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  verify_windows:
    needs: [verify_linux]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run all native Windows Go tests
        run: go test -count=1 ./...
      - uses: actions/download-artifact@v4
        with:
          name: mpd-v013-test2-certified-candidate
      - name: Verify actual release candidate digest on Windows
        shell: pwsh
        run: |
          $expected = ((Get-Content SHA256SUMS.txt).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Path .\MagicPatchDesk-Windows-x64.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {throw "Release candidate checksum mismatch"}
      - name: Run EXACT release EXE health and Win32 UI smoke modes
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'MagicPatchDesk-Windows-x64.exe'
          foreach ($option in @('--mpd-healthcheck-v1','--mpd-ui-smoke-v1')) {
            $p = Start-Process -FilePath $exe -ArgumentList $option -PassThru -ErrorAction Stop
            if (-not $p.WaitForExit(20000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$option timed out"
            }
            if ($p.ExitCode -ne 0) {throw "$option failed with exit code $($p.ExitCode)"}
            Write-Output "$option completed successfully"
          }
  publish_preview:
    needs: [verify_linux, verify_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mpd-v013-test2-certified-candidate
      - name: Ensure artifacts are identical to the tested EXE and retain updater contract
        run: |
          sha256sum -c SHA256SUMS.txt
          bash scripts/verify_release_contract.sh
      - name: Publish TEST preview only after all platform gates pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.13.0-test.2 \
            MagicPatchDesk-Windows-x64.exe \
            SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.13 test 2 — Game Outputs integrity fixes (PREVIEW)" \
            --notes-file docs/RELEASE_NOTES_v0.13.0-test.2.md \
            --prerelease
      - name: Assert updater-ready preview assets actually exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verified="$(gh release view v0.13.0-test.2 --repo "${GITHUB_REPOSITORY}" --json tagName,isPrerelease,assets \
            --jq '(.tagName=="v0.13.0-test.2") and .isPrerelease and (any(.assets[]; .name=="MagicPatchDesk-Windows-x64.exe")) and (any(.assets[]; .name=="SHA256SUMS.txt"))')"
          test "$verified" = true
          echo "Preview release exists with canonical EXE and checksums."
