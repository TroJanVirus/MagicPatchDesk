name: One-shot v0.14.0-test.24 BeatDown grouping release
on:
  push:
    branches:
      - fix/beatdown-conservative-title-id-grouping
    paths:
      - .github/workflows/one-shot-release-test24.yml

permissions:
  contents: write

concurrency:
  group: magicpatchdesk-test24-only
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify updater protocol, media fixture and embedded icon
        run: |
          bash scripts/verify_release_contract.sh
          python3 scripts/test_patchhub_media_index.py
          grep -Fq 'const AppVersion = "v0.14.0-test.24"' core/update.go
          python3 scripts/build_windows_icon.py
      - name: Test all Go code and BeatDown anti-collision regressions
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./core
          go vet ./...
      - name: Cross-build Windows x64 GUI and check SHA256
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-H windowsgui -s -w" -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
          file MagicPatchDesk-Windows-x64.exe | grep 'PE32+'
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-test24-win64
          path: |
            MagicPatchDesk-Windows-x64.exe
            SHA256SUMS.txt
          retention-days: 2
          if-no-files-found: error

  native-windows-smoke:
    needs: verify-and-build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-test24-win64
          path: .
      - name: Native GUI, cover diagnostics and updater verification
        shell: pwsh
        run: |
          $exe=Join-Path $pwd "MagicPatchDesk-Windows-x64.exe"
          $p=Start-Process -FilePath $exe -ArgumentList "--mpd-ui-smoke-v1" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Native Windows UI smoke failed: $($p.ExitCode)" }
          $p=Start-Process -FilePath $exe -ArgumentList "--mpd-healthcheck-v1" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Updater healthcheck failed: $($p.ExitCode)" }

  publish:
    needs: native-windows-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-test24-win64
          path: .
      - name: Publish only after native Windows passes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          if gh release view v0.14.0-test.24 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create v0.14.0-test.24 MagicPatchDesk-Windows-x64.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --prerelease \
            --title "Magic Patch Desk v0.14.0 test 24 — safe BeatDown title grouping" \
            --notes-file docs/RELEASE_NOTES_v0.14.0-test.24.md
