name: One-shot Magic Patch Desk test.16 ISO picker audit

on:
  push:
    branches:
      - fix/iso-picker-nonblocking-validation-20261122
    paths:
      - .github/workflows/release-test16-once.yml

permissions:
  contents: write

concurrency:
  group: magicpatchdesk-test16-once
  cancel-in-progress: false

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify permanent updater contract
        run: bash scripts/verify_release_contract.sh
      - name: Verify PatchHub image index fixture
        run: python3 scripts/test_patchhub_media_index.py
      - name: Build official JMP Windows icon resource
        run: python3 scripts/build_windows_icon.py
      - name: Run Go tests including 7,500-entry ISO tree and malformed images
        run: go test -count=1 ./...
      - name: Run Go race detector
        run: go test -race -count=1 ./core
      - name: Vet all packages
        run: go vet ./...
      - name: Cross-build Windows 10/11 x64 native GUI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Check version, PE and SHA manifest
        run: |
          grep -q 'const AppVersion = "v0.14.0-test.16"' core/update.go
          grep -q 'const UpdateProtocol = 1' core/update.go
          test -s MagicPatchDesk-Windows-x64.exe
          file MagicPatchDesk-Windows-x64.exe | grep -q PE32
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test16-verified-windows
          path: |
            MagicPatchDesk-Windows-x64.exe
            SHA256SUMS.txt
          retention-days: 1

  native-windows-smoke:
    needs: verify-linux
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test16-verified-windows
      - name: Run native Win32 GUI smoke and health check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MPD_UI_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'mpd-ui-smoke.txt'
          Remove-Item $env:MPD_UI_SMOKE_REPORT -ErrorAction SilentlyContinue
          $exe = Join-Path (Get-Location) 'MagicPatchDesk-Windows-x64.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--mpd-ui-smoke-v1' -PassThru
          if (-not $proc.WaitForExit(150000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Native Win32 smoke hung for over 150 seconds'
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $env:MPD_UI_SMOKE_REPORT) {
              Write-Host 'Synthetic Win32 smoke diagnostic:'
              Get-Content $env:MPD_UI_SMOKE_REPORT
            }
            throw "Native Win32 smoke failed, exit code $($proc.ExitCode)"
          }
          Write-Host 'Native Win32 GUI smoke succeeded.'
          $health = Start-Process -FilePath $exe -ArgumentList '--mpd-healthcheck-v1' -PassThru -Wait
          if ($health.ExitCode -ne 0) { throw "Updater health check failed: $($health.ExitCode)" }
          Write-Host 'Updater health check succeeded.'

  publish:
    needs: [verify-linux, native-windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test16-verified-windows
      - name: Verify canonical binary checksum
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish after Linux tests and real Windows smoke succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.14.0-test.16 \
            MagicPatchDesk-Windows-x64.exe SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Magic Patch Desk v0.14.0 test 16 — ISO picker stability" \
            --notes-file docs/RELEASE_NOTES_v0.14.0-test.16.md \
            --prerelease
