name: Publish v0.12.0 test (one-shot updater contract)
on:
  push:
    branches: [release/v0.12.0-test.1]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enforce permanent self-update compatibility contract
        run: bash scripts/verify_release_contract.sh
      - name: Unit, race and vet checks
        run: |
          go test ./...
          go test -race ./core
          go vet ./...
      - name: Cross-compile native Windows x64 executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Legacy versioned asset and SHA-256 manifest
        run: |
          cp MagicPatchDesk-Windows-x64.exe MagicPatchDesk-v0.12.0-test-Windows-x64.exe
          sha256sum MagicPatchDesk-Windows-x64.exe MagicPatchDesk-v0.12.0-test-Windows-x64.exe > SHA256SUMS.txt
          test -s MagicPatchDesk-Windows-x64.exe
          grep -q 'MagicPatchDesk-Windows-x64.exe' SHA256SUMS.txt
      - name: Publish developer test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.12.0-test.1 \
            MagicPatchDesk-Windows-x64.exe \
            MagicPatchDesk-v0.12.0-test-Windows-x64.exe \
            SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.12 — Permanent self-updates, CCI and automated diagnostics" \
            --notes-file docs/RELEASE_NOTES_v0.12.0-test.md \
            --prerelease
