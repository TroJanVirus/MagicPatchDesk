name: Publish v0.4.0 test 2 (one-shot)
on:
  push:
    branches: [release/v0.4.0-test.2]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run unit, race and static checks
        run: |
          go test ./...
          go test -race ./core
          go vet ./...
      - name: Build Windows portable app
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-v0.4.0-test2-Windows-x64.exe ./cmd/magicdesk
      - name: Build checksum
        run: sha256sum MagicPatchDesk-v0.4.0-test2-Windows-x64.exe > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.0-test.2 MagicPatchDesk-v0.4.0-test2-Windows-x64.exe SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.4.0 test 2 — Source-aware conversion and artwork fixes" \
            --notes-file docs/RELEASE_NOTES_v0.4.0-test.md \
            --prerelease
