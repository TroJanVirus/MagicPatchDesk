name: One-shot Magic Patch Desk test.17 rapid source switching

on:
  push:
    branches:
      - fix/rapid-source-switch-serialized-20261122
    paths:
      - .github/workflows/release-test17-once.yml

permissions:
  contents: write

concurrency:
  group: magicpatchdesk-test17-one-shot
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify permanent self-update contract
        run: bash scripts/verify_release_contract.sh
      - name: Check Patch Hub media index fixture
        run: python3 scripts/test_patchhub_media_index.py
      - name: Embed official Magic Patch Desk EXE icon
        run: python3 scripts/build_windows_icon.py
      - name: Go tests including 120 mixed ISO CCI XBE inspections and cancellation
        run: go test -count=1 ./...
      - name: Go race detector on core
        run: go test -race -count=1 ./core
      - name: Go vet
        run: go vet ./...
      - name: Cross-build Windows x64 native GUI with rapid-switch smoke
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Verify stable update protocol, PE and SHA256
        run: |
          grep -q 'const AppVersion = "v0.14.0-test.17"' core/update.go
          grep -q 'const UpdateProtocol = 1' core/update.go
          test -s MagicPatchDesk-Windows-x64.exe
          file MagicPatchDesk-Windows-x64.exe | grep -q PE32
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test17-windows
          path: |
            MagicPatchDesk-Windows-x64.exe
            SHA256SUMS.txt
          retention-days: 1

  native-windows-stress-and-publish:
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test17-windows
      - name: Run native Windows UI stress (360 ISO CCI XBE switches) and health check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path (Get-Location) 'MagicPatchDesk-Windows-x64.exe'
          $env:MPD_UI_SMOKE_REPORT=Join-Path $env:RUNNER_TEMP 'mpd-stress-smoke.txt'
          Remove-Item $env:MPD_UI_SMOKE_REPORT -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $exe -ArgumentList '--mpd-ui-smoke-v1' -PassThru
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Native source-switch stress smoke exceeded 180 seconds'
          }
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $env:MPD_UI_SMOKE_REPORT) {Get-Content $env:MPD_UI_SMOKE_REPORT}
            throw "Native Windows smoke exited $($proc.ExitCode)"
          }
          Write-Host 'Native Win32 smoke including 360 rapid ISO/CCI/XBE transitions: PASS'
          $health=Start-Process -FilePath $exe -ArgumentList '--mpd-healthcheck-v1' -PassThru -Wait
          if ($health.ExitCode -ne 0){throw "Self-update health check exited $($health.ExitCode)"}
          Write-Host 'Updater protocol v1 health check: PASS'
      - name: Publish only after ALL core and native Windows stress tests pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $actual=(Get-FileHash 'MagicPatchDesk-Windows-x64.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=((Get-Content 'SHA256SUMS.txt' -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if($actual -ne $expected){throw 'SHA-256 mismatch before release'}
          gh release create v0.14.0-test.17 MagicPatchDesk-Windows-x64.exe SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Magic Patch Desk v0.14.0 test 17 — rapid ISO/CCI/XBE stability" --notes-file docs/RELEASE_NOTES_v0.14.0-test.17.md --prerelease
