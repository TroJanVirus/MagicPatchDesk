name: Publish v0.11.0 test (one-shot)
on:
  push:
    branches: [release/v0.11.0-test.1]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core tests, race check and static analysis
        run: |
          go test ./...
          go test -race ./core
          go vet ./...
      - name: Portable native Windows x64 build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-v0.11.0-test-Windows-x64.exe ./cmd/magicdesk
      - name: SHA-256 checksum
        run: sha256sum MagicPatchDesk-v0.11.0-test-Windows-x64.exe > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.11.0-test.1 MagicPatchDesk-v0.11.0-test-Windows-x64.exe SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.11.0 test 1 — Recent files and shortcuts" \
            --notes-file docs/RELEASE_NOTES_v0.11.0-test.md \
            --prerelease
