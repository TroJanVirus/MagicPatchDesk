name: Publish v0.12.0 test 2 (one-shot updater fix)
on:
  push:
    branches: [release/v0.12.0-test.2]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'TroJanVirus/MagicPatchDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify durable update protocol and release contract
        run: bash scripts/verify_release_contract.sh
      - name: Unit tests, race detection and vet
        run: |
          go test ./...
          go test -race ./core
          go vet ./...
      - name: Build native portable Windows x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Verify assets and SHA-256
        run: |
          cp MagicPatchDesk-Windows-x64.exe MagicPatchDesk-v0.12.0-test2-Windows-x64.exe
          sha256sum MagicPatchDesk-Windows-x64.exe MagicPatchDesk-v0.12.0-test2-Windows-x64.exe > SHA256SUMS.txt
          grep -q 'MagicPatchDesk-Windows-x64.exe' SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.12.0-test.2 \
            MagicPatchDesk-Windows-x64.exe \
            MagicPatchDesk-v0.12.0-test2-Windows-x64.exe \
            SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.12 test 2 — Updater fix, Cerbios CCI, auto reports" \
            --notes-file docs/RELEASE_NOTES_v0.12.0-test.md \
            --prerelease
