name: One-shot v0.14.0-test.4 crash recovery and UI regression gate
on:
  push:
    branches: [fix/crash-report-dedup-notes-scroll-v014]
    paths: ['.github/workflows/publish-v014-crash-one-shot.yml']
permissions:
  contents: read
concurrency:
  group: mpd-v014-crash-once
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check updater compatibility, credits and preview version
        run: |
          bash scripts/verify_release_contract.sh
          grep -q 'const AppVersion = "v0.14.0-test.4"' core/update.go
          test -f confidence/reports.v1.json
          test -f docs/LIBRARY_MANAGER_AND_CONFIDENCE.md
          test -f docs/RELEASE_NOTES_v0.14.0-test.4.md
          test -f docs/CRASH_RECOVERY_AND_UI.md
      - name: Complete Go regression tests
        run: go test -count=1 ./...
      - name: Race check
        run: go test -race -count=1 ./core
      - name: Static analysis
        run: go vet ./...
      - name: Build unsigned Windows x64 native GUI release candidate
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Verify canonical SHA256 manifest
        run: |
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c%s MagicPatchDesk-Windows-x64.exe)" -gt 1000000
      - uses: actions/upload-artifact@v4
        with:
          name: mpd-v014-crash-release-verified
          path: |
            MagicPatchDesk-Windows-x64.exe
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
  windows:
    needs: [linux]
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run all native Windows Go regression tests
        run: go test -count=1 ./...
      - uses: actions/download-artifact@v4
        with:
          name: mpd-v014-crash-release-verified
      - name: Check transferred release EXE digest on native Windows
        shell: pwsh
        run: |
          $expected = ((Get-Content SHA256SUMS.txt).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Path .\MagicPatchDesk-Windows-x64.exe -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {throw 'Windows candidate hash mismatch'}
      - name: Execute SAME release EXE with stable updater healthcheck and UI smoke
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'MagicPatchDesk-Windows-x64.exe'
          foreach ($arg in @('--mpd-healthcheck-v1','--mpd-ui-smoke-v1')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru -ErrorAction Stop
            if (-not $p.WaitForExit(20000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$arg timed out"
            }
            if ($p.ExitCode -ne 0) {throw "$arg failed with exit code $($p.ExitCode)"}
            Write-Output "$arg PASS"
          }
  publish:
    needs: [linux,windows]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mpd-v014-crash-release-verified
      - name: Reverify exact Windows-tested artifact before publication
        run: |
          sha256sum -c SHA256SUMS.txt
          bash scripts/verify_release_contract.sh
      - name: Publish prerelease only after full validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.14.0-test.4 \
            MagicPatchDesk-Windows-x64.exe \
            SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Magic Patch Desk v0.14 test 4 — Crash Recovery, Notes & Scrollbars (PREVIEW)" \
            --notes-file docs/RELEASE_NOTES_v0.14.0-test.4.md \
            --prerelease
      - name: Verify canonical release assets and prerelease status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verified="$(gh release view v0.14.0-test.4 --repo "${GITHUB_REPOSITORY}" --json tagName,isPrerelease,assets \
            --jq '(.tagName=="v0.14.0-test.4") and .isPrerelease and (any(.assets[]; .name=="MagicPatchDesk-Windows-x64.exe")) and (any(.assets[]; .name=="SHA256SUMS.txt"))')"
          test "$verified" = true
# One-off gated release; remove publisher after success to conserve Actions minutes.
