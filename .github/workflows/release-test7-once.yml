name: One-shot Magic Patch Desk test.7 release

on:
  push:
    branches:
      - fix/crc-warning-media-validation-20261122
    paths:
      - .github/workflows/release-test7-once.yml

permissions:
  contents: write

concurrency:
  group: magicpatchdesk-test7-once
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify updater release contract
        run: bash scripts/verify_release_contract.sh
      - name: Validate website image-index generator
        run: python3 scripts/test_patchhub_media_index.py
      - name: Embed JMP Windows icon
        run: python3 scripts/build_windows_icon.py
      - name: Go tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./core
      - name: Go vet
        run: go vet ./...
      - name: Windows x64 GUI cross-build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o MagicPatchDesk-Windows-x64.exe ./cmd/magicdesk
      - name: Validate version and binary
        run: |
          grep -q 'const AppVersion = "v0.14.0-test.7"' core/update.go
          test -s MagicPatchDesk-Windows-x64.exe
          file MagicPatchDesk-Windows-x64.exe | grep -q PE32
          sha256sum MagicPatchDesk-Windows-x64.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish preview release (only after every check passes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.14.0-test.7 \
            MagicPatchDesk-Windows-x64.exe SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Magic Patch Desk v0.14.0 test 7 — CRC, themes and media discovery" \
            --notes "Preview update with explicit XBE CRC mismatch warnings, original-versus-prepatched converter verification, deduplicated patch audit in Settings, four colour themes including Light, and generic PatchHub media-index lookup. Existing updater v1 and independent source files are preserved. PatchHub must publish patchhub-media-v1.json for arbitrary server-side screenshot filenames. Windows interactive GUI behaviour still needs hands-on field QA." \
            --prerelease
